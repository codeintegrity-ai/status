<!--

Project override of themes/cstate/layouts/partials/custom/meta.html

Emits the CodeIntegrity brand icons. cState ships no icon <link> tags of its
own, so without these only /favicon.ico is picked up by auto-discovery.

Requires `enableCustomHTML: true` in config.yml — the theme gates this partial
behind that flag.

Source of truth for the assets is codeintegrity-fe/brand-assets
(`pnpm generate:all`); copies live in static/.

-->

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
